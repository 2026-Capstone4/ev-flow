<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 위는 밝고 아래로 갈수록 살짝 어두워져 입체감. E 평균 불투명도는 전과 비슷한 0.85 -->
    <linearGradient id="eFill" x1="0" y1="278" x2="0" y2="746" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.76"/>
    </linearGradient>
    <linearGradient id="boltFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE36A"/>
      <stop offset="1" stop-color="#FFC21F"/>
    </linearGradient>
    <!-- 아래로 떨어지는 옅은 그림자. 반투명한 E 안으로 비치지 않게 모양 안쪽은 지움 -->
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12" result="blur"/>
      <feFlood flood-color="#142C80" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in" result="shadow"/>
      <feComponentTransfer in="SourceAlpha" result="solid"><feFuncA type="linear" slope="100"/></feComponentTransfer>
      <feComposite in="shadow" in2="solid" operator="out" result="outer"/>
      <feMerge><feMergeNode in="outer"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#3B63E4"/>
  <g transform="translate(-10,0)" filter="url(#lift)">
    <path d="M240 322V702M240 322H470M240 512H420M240 702H470" stroke="url(#eFill)" stroke-width="88" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path transform="translate(383,213) scale(5)" d="M70 16L36 66H60L52 106L90 50H64Z" fill="url(#boltFill)" stroke="url(#boltFill)" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>

# 레포 전체 PR 검사 — 모든 PR에서 실행하고, 바뀐 파트의 검사 job만 돌림
# 구조: changes(바뀐 파트 확인) → <파트>-check(바뀐 파트만 실행) → ci-result(결과 모음)
# ruleset 필수 체크는 ci-result 하나만 지정 — 파트를 추가해도 ruleset은 고치지 않음
# 배포는 하지 않음 (배포는 서버에서 infra/deploy.sh로 수동 진행 — docs/decisions.md CI-02)
#
# 파트 추가 방법 (예: ml)
#   1. changes job의 outputs와 "바뀐 파트 확인" 단계에 ml 판정 추가
#   2. ml-check job 추가 (if: needs.changes.outputs.ml == 'true')
#   3. ci-result의 needs에 ml-check 추가
name: ci

on:
  # develop · main으로 가는 모든 PR에서 실행 — 경로 필터를 걸지 않음
  # (필터로 워크플로가 아예 안 돌면 필수 체크 결과가 안 남아 병합이 막히기 때문)
  pull_request:
    branches: [develop, main]
  # Actions 탭에서 원하는 브랜치를 골라 수동으로 실행할 수 있게 함 (모든 파트 검사)
  workflow_dispatch:

# 코드를 읽기만 하므로 저장소 쓰기 권한을 주지 않음
permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소하고 최신 커밋만 검사함
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PR에서 바뀐 파일을 보고 어떤 파트의 검사를 돌릴지 정함
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      # PR 시작 지점과 비교하려면 커밋 기록이 필요해서 전체 기록을 받음
      - name: 코드 받기
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 바뀐 파트 확인
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 수동 실행이면 비교할 PR이 없으므로 모든 파트를 검사함
          if [ -z "$BASE_SHA" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 세 점(...) 비교: 브랜치가 갈라진 지점부터 PR 브랜치에서 바뀐 파일만 뽑음
          # (develop에 나중에 들어온 다른 PR의 변경은 섞이지 않음)
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "바뀐 파일:"
          echo "$changed"

          # frontend/ 아래 파일이나 이 워크플로 파일이 바뀌면 FE 검사를 돌림
          if echo "$changed" | grep -qE '^(frontend/|\.github/workflows/ci\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          # backend/ 아래 파일이나 이 워크플로 파일이 바뀌면 BE 검사를 돌림
          if echo "$changed" | grep -qE '^(backend/|\.github/workflows/ci\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  # 프론트엔드 검사 — lint · 포맷 · 타입 · 테스트 · 빌드를 차례로 실행
  frontend-check:
    needs: changes
    # FE가 안 바뀐 PR에서는 건너뜀 → GitHub은 건너뛴 job을 통과로 기록함
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # 설치가 멈추는 등 이상 상황에서 무료 실행 시간을 낭비하지 않도록 10분에서 끊음
    timeout-minutes: 10
    defaults:
      run:
        # 모든 run 단계를 frontend/ 폴더에서 실행
        working-directory: frontend

    steps:
      - name: 코드 받기
        uses: actions/checkout@v7

      # Node 버전은 YAML에 적지 않고 frontend/.nvmrc를 따름 → 로컬과 CI 버전이 항상 같음
      - name: Node.js 설치
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      # pnpm 버전은 package.json의 packageManager를 따름
      # cache: lock 파일 내용이 같으면 이전 실행에서 받은 패키지를 재사용해 설치 시간을 줄임
      - name: pnpm 설치
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml

      # lock 파일과 package.json이 맞지 않으면 설치를 고치지 않고 실패시킴
      - name: 패키지 설치
        run: pnpm install --frozen-lockfile

      - name: 린트
        run: pnpm lint

      # 파일을 고치지 않고 Prettier 규칙에 맞는지만 확인 — 실패하면 로컬에서 pnpm format 실행
      - name: 포맷 검사
        run: pnpm format:check

      - name: 타입 검사
        run: pnpm typecheck

      - name: 테스트
        run: pnpm test

      # .env 없이 빌드 → VITE_USE_MOCK이 비어 있어 Mock을 뺀 배포용 번들로 빌드되는지 확인
      - name: 빌드
        run: pnpm build

  # 백엔드 검사 — 린트 · 포맷 · 테스트를 차례로 실행
  backend-check:
    needs: changes
    # BE가 안 바뀐 PR에서는 건너뜀 → GitHub은 건너뛴 job을 통과로 기록함
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 코드 받기
        uses: actions/checkout@v7

      # Python 버전은 운영 이미지(Dockerfile python:3.11)와 맞춤
      # cache: requirements 파일 내용이 같으면 이전 실행에서 받은 패키지를 재사용
      - name: Python 설치
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # 운영 패키지 + pytest · ruff (버전은 requirements 파일에 고정)
      - name: 패키지 설치
        run: pip install -r requirements-dev.txt

      # --output-format=github: 오류를 PR의 Files changed 화면에 줄 단위로 표시
      - name: 린트
        run: ruff check --output-format=github .

      # 파일을 고치지 않고 확인만 — 실패하면 로컬에서 ruff format . 실행
      - name: 포맷 검사
        run: ruff format --check .

      # 판정 로직 단위 테스트 — DB · .env 없이 실행
      - name: 테스트
        run: pytest

  # 모든 검사 결과를 모아 하나로 판단 — ruleset 필수 체크는 이 job만 지정
  ci-result:
    needs: [changes, frontend-check, backend-check]
    # 앞 job이 실패하거나 건너뛰어도 항상 실행해서 결과를 남김 (안 남기면 병합이 막힘)
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 결과 확인
        env:
          # 예: "success skipped" — needs에 적은 job들의 결과
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "검사 결과: $RESULTS"
          for result in $RESULTS; do
            # 실패 · 취소가 하나라도 있으면 실패 → 병합 막힘
            # 통과(success) · 건너뜀(skipped)은 문제없음으로 봄
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "실패하거나 취소된 검사가 있음"
              exit 1
            fi
          done
          echo "모든 검사 통과"

# 로컬 개발 전용 - Compose가 docker-compose.yml과 함께 자동으로 읽음
# EC2 배포는 이 파일을 빼고 실행함: docker compose -f docker-compose.yml up -d
# 모든 포트를 127.0.0.1에 묶음 - 0.0.0.0이면 같은 네트워크에서 접근 가능하고,
# EC2에서 -f를 빠뜨려 이 파일이 읽히면 DB·redis가 인터넷에 공개됨
services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"  # 호스트에 이미 깔린 postgres(5432)와 충돌 피함

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  api:
    ports:
      - "127.0.0.1:8000:8000"

  ml:
    ports:
      - "127.0.0.1:8001:8001"  # 예측 응답 직접 확인용

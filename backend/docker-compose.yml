services:
  postgres:
    image: postgres:16
    container_name: evflow-postgres
    environment:
      POSTGRES_USER: evflow
      POSTGRES_PASSWORD: evflow
      POSTGRES_DB: evflow
    ports:
      - "5432:5432"
    volumes:
      - evflow_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: evflow-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evflow-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evflow-collector
    command: python -m app.collector.scheduler
    env_file: .env
    depends_on:
      - postgres

volumes:
  evflow_pgdata:

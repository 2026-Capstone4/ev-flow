name: ev-flow

# EC2 디스크가 컨테이너 로그로 차는 것 방지 - 서비스당 최대 30MB
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    container_name: evflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 필요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 필요}
    # 포트 미개방 - 로컬 접속은 docker-compose.override.yml에서만 열림
    volumes:
      - evflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7
    container_name: evflow-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evflow-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      # .env 값은 호스트 직접 실행용이라 컨테이너 내부 주소로 덮어씀
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # 예측 조회용 (docs/prediction.md) - 없으면 기본값 localhost를 봐서 예측이 항상 null이 됨
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evflow-collector
    command: python -m app.collector.scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # 예측 갱신용 (docs/prediction.md) - depends_on은 걸지 않음: redis · ml이 죽어도 수집은 계속돼야 함
      REDIS_URL: redis://redis:6379/0
      ML_URL: http://ml:8001
      PRODUCER_URL: http://producer:8002
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # 혼잡 · 대기 예측 (docs/prediction.md) - AI 패키지의 backend_app을 그대로 실행, 우리 코드는 이미지 설정뿐
  # collector가 도심 회차마다 POST /internal/v1/predict {"run_id"} → ml이 ml_read · ml_checkpoint를 직접 읽음
  ml:
    build:
      context: ../ml
      dockerfile: Dockerfile
    container_name: evflow-ml
    environment:
      # 읽기 전용 접속 evflow_ml_reader (docs/database.md) - .env 전체를 넘기지 않고 이 값만 전달
      # 비어 있으면 모델 로드 단계에서 시작을 못 함 - collector는 예측만 건너뛰고 수집은 계속함
      EVFLOW_ML_READONLY_DSN: ${EVFLOW_ML_READONLY_DSN:-}
      EVFLOW_POSTGRES_SCHEMA: ml_read
      EVFLOW_CHECKPOINT_SCHEMA: ml_checkpoint
      # producer와 반드시 같은 값 - 체크포인트에 원천 이름이 묶여 있어 다르면 전부 거부됨(대기 예측이 모두 빠짐)
      EVFLOW_SOURCE_ID: ${EVFLOW_SOURCE_ID:-evflow-local}
    # 패키지(코드 · 모델)는 저장소 · 이미지에 넣지 않고 서버 ml/package/에 둠 - producer와 같은 폴더를 써서 버전이 항상 같음
    # 교체는 ml/package/를 새 패키지로 바꾸고 producer · ml 재시작 (docs/prediction.md 모델 교체)
    volumes:
      - ../ml/package:/package:ro
    expose:
      - "8001"
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

  # 체크포인트 producer (docs/prediction.md) - collector가 도심 회차를 커밋할 때마다 POST /runs/{run_id}
  # AI 패키지 코드는 이미지에 넣지 않고 서버 ml/package/에 풀어 둠 (모델 파일과 같은 방식)
  producer:
    build:
      context: ../producer
    container_name: evflow-producer
    environment:
      EVFLOW_POSTGRES_SCHEMA: ml_read
      EVFLOW_CHECKPOINT_SCHEMA: ml_checkpoint
      EVFLOW_CHECKPOINT_DIR: /state/evflow
      # 로컬 · 서버 DB 이름이 같아 기본값(DB 이름:스키마)이 겹침 - 서버 .env에서 evflow-prod로 지정
      EVFLOW_SOURCE_ID: ${EVFLOW_SOURCE_ID:-evflow-local}
      # 계산은 읽기 전용 evflow_ckpt_reader, 게시만 evflow_ckpt_writer - 패키지가 이 두 이름으로 읽음
      EVFLOW_ML_READONLY_DSN: ${EVFLOW_CKPT_READER_DSN:-}
      EVFLOW_CHECKPOINT_WRITER_DSN: ${EVFLOW_CKPT_WRITER_DSN:-}
    volumes:
      - ../ml/package:/package:ro
      # 최신 상태(latest.json) · 회차별 파일 · OS 잠금 - 다음 실행까지 남아 있어야 함. 잃으면 --initialize로 재구축
      - evflow_checkpoint_state:/state/evflow
    expose:
      - "8002"
    # AI 측정: 최초 구축 최대 약 105MiB(384MiB 한도) · 증분 약 80MiB
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # 외부 공개는 이 서비스만 - 나머지는 Compose 내부 네트워크로만 접근
  nginx:
    image: nginx:1.27-alpine
    container_name: evflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 프론트 빌드 결과 (INF-05) - 맥에서 빌드 후 rsync로 서버 frontend/dist에 복사, git에는 없음
      - ../frontend/dist:/usr/share/nginx/html:ro
      # 인증서는 서버의 certbot이 발급 · 갱신함 (CI-06) - live/가 archive/를 가리키는 링크라 폴더 전체를 마운트
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # 발급 · 갱신 확인 파일 - certbot이 쓰고 nginx는 읽기만 함
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging

volumes:
  evflow_pgdata:
  evflow_checkpoint_state:

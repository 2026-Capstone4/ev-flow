name: ev-flow

# EC2 디스크가 컨테이너 로그로 차는 것 방지 - 서비스당 최대 30MB
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    container_name: evflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 필요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 필요}
    # 포트 미개방 - 로컬 접속은 docker-compose.override.yml에서만 열림
    volumes:
      - evflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7
    container_name: evflow-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evflow-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      # .env 값은 호스트 직접 실행용이라 컨테이너 내부 주소로 덮어씀
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # 예측 조회용 (docs/prediction.md) - 없으면 기본값 localhost를 봐서 예측이 항상 null이 됨
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evflow-collector
    command: python -m app.collector.scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # 예측 갱신용 (docs/prediction.md) - depends_on은 걸지 않음: redis · ml이 죽어도 수집은 계속돼야 함
      REDIS_URL: redis://redis:6379/0
      ML_URL: http://ml:8001
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  ml:
    build:
      context: ../ml
      dockerfile: Dockerfile
    container_name: evflow-ml
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 1
    environment:
      MODEL_DIR: /models
    # 모델 파일은 저장소 · 이미지에 넣지 않고 서버의 ml/models/에 둠 (AI-02) - 교체 후 ml 재시작
    volumes:
      - ../ml/models:/models:ro
    expose:
      - "8001"
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

  # 외부 공개는 이 서비스만 - 나머지는 Compose 내부 네트워크로만 접근
  nginx:
    image: nginx:1.27-alpine
    container_name: evflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 인증서는 서버의 certbot이 발급 · 갱신함 (CI-06) - live/가 archive/를 가리키는 링크라 폴더 전체를 마운트
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # 발급 · 갱신 확인 파일 - certbot이 쓰고 nginx는 읽기만 함
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging

volumes:
  evflow_pgdata:

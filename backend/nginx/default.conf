# HTTP - 인증서 확인 요청만 받고 나머지는 HTTPS로 넘김
server {
    listen 80;
    server_name _;

    # Let's Encrypt 발급 · 갱신 확인 - 서버의 certbot이 이 폴더에 확인 파일을 씀
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # IP로 들어와도 도메인으로 보냄 - 인증서는 도메인 이름으로만 발급됨
    location / {
        return 301 https://evflowkr.app$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name evflowkr.app;

    # 서버의 /etc/letsencrypt를 그대로 마운트 (live/는 archive/를 가리키는 링크라 폴더 전체 필요)
    ssl_certificate     /etc/letsencrypt/live/evflowkr.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evflowkr.app/privkey.pem;

    # 화면 JS · CSS와 API JSON 압축 - 모바일 첫 로딩 단축
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker 내부 DNS - api 컨테이너가 재생성돼 IP가 바뀌어도 502가 나지 않게 함
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 프론트 정적 파일 (frontend/dist 마운트, INF-05)
    root /usr/share/nginx/html;

    # 화면 경로는 빌드 때 미리 만든 파일(/support → support.html)이 있으면 그것을, 없으면(/stations/... 등) index.html로 - React Router가 처리
    # 미리 만든 HTML도 옛 JS 파일 이름을 가리키지 않게 매번 확인함 (빌드 파일 /assets/는 아래에서 따로 오래 캐시)
    # FastAPI의 /docs 등은 /api/ 밖이라 여기로 와도 api에 닿지 않음
    # $uri/(폴더)는 찾지 않음 - 빌드에 more/ 폴더가 있어 /more/ 요청이 폴더로 가면 index.html이 없어 403이 남
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html /index.html;
    }

    # 홈만 홈 글을 미리 넣은 home.html을 줌 - index.html은 다른 모든 주소가 받는 파일이라 본문을 비워 둠
    # home.html이 없는 빌드면 index.html로
    location = / {
        add_header Cache-Control "no-cache";
        try_files /home.html /index.html;
    }

    # 새 빌드가 바로 반영되도록 index.html은 매번 확인
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 앱 새 버전 안내 파일 (backend/nginx/app-meta 마운트) - 웹 빌드와 따로 두어 웹 배포 없이 git pull만으로 바뀜
    # 출시 직후 바로 보이게 매번 확인하고, 파일이 없으면 index.html 대신 404를 줌
    location = /app-version.json {
        root /usr/share/nginx/app-meta;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 빌드 파일은 이름에 해시가 붙어 내용이 바뀌면 이름도 바뀜 - 오래 캐시
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}

# pnpm 워크스페이스 — 웹(frontend) · RN 앱(mobile) · 웹 · 앱 공용 코드(packages/core)를 한 lock 파일로 관리
packages:
  - frontend
  - mobile
  - packages/*

# react-router는 타입을 @types/react에서 읽는데 의존성에 적혀 있지 않아, pnpm이 공용 위치에 올린 버전을 씀
# 앱(React 19)이 쓰는 @types/react 19가 거기 올라가면 웹(React 18)에서 react-router 컴포넌트 타입이 깨짐
# → 의존성으로 적어 두어 웹에서는 웹의 @types/react(18)를 쓰게 함
packageExtensions:
  react-router:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true

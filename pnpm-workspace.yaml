# pnpm 워크스페이스 — 웹(frontend) · RN 앱(mobile) · 웹 · 앱 공용 코드(packages/core)를 한 lock 파일로 관리
packages:
  - frontend
  - mobile
  - packages/*

# react-router는 타입을 @types/react에서 읽는데 의존성에 적혀 있지 않아, pnpm이 공용 위치에 올린 버전을 씀
# 앱(React 19)이 쓰는 @types/react 19가 거기 올라가면 웹(React 18)에서 react-router 컴포넌트 타입이 깨짐
# → 의존성으로 적어 두어 웹에서는 웹의 @types/react(18)를 쓰게 함
packageExtensions:
  react-router:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true

# 네이버 지도 RN 라이브러리 2.11.0(최신)은 NaverMapPolylineOverlay가 pattern(점선)을 받기만 하고 네이티브에 안 넘김
# → 넘기게 한 줄 고침 (앱 길찾기 경로 끝 점선). 네이티브 쪽은 이미 pattern을 처리해서 앱을 다시 빌드할 필요 없음
patchedDependencies:
  '@mj-studio/react-native-naver-map@2.11.0': patches/@mj-studio__react-native-naver-map@2.11.0.patch
